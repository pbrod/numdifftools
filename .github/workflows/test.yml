# .github/workflows/ci.yml
# This workflow runs Continous Integration (CI) including tests and linting.
# for a variety of Python versions
# For more information see:
# https://py-pkgs.org/08-ci-cd
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI - Tests

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    # Runs Monday through Friday at 02:00 UTC
    - cron: '0 2 * * 1-5'

jobs:
  ci:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}

    # Ensure matplotlib uses a non-interactive backend on all runners
    env:
      MPLBACKEND: Agg
      # Store matplotlib config inside the workspace to avoid permission issues
      MPLCONFIGDIR: ${{ github.workspace }}/.matplotlib

    strategy:
      matrix:
        python_version: ["3.15", "3.14", "3.13", "3.12", "3.11", "3.10"]
        os: [ubuntu-latest, macos-latest, windows-latest]

      fail-fast: false

    # Allow Python 3.15 jobs to fail without failing the workflow
    continue-on-error: ${{ matrix.python_version == '3.15' }}

    steps:
      - uses: actions/checkout@v5

      # If we're testing with Python 3.14, use a dedicated lockfile (pdm.lock314) by copying it
      # over pdm.lock before any dependency install or cache key evaluation that reads pdm.lock.
      - name: Use pdm.lock314 (linux/mac)
        if: matrix.python_version == '3.14' && matrix.os != 'windows-latest'
        run: |
          if [ -f pdm.lock314 ]; then
            echo "Using pdm.lock314 for python 3.14"
            cp pdm.lock314 pdm.lock
          else
            echo "pdm.lock314 not found; falling back to pdm.lock"
          fi
        shell: bash

      - name: Use pdm.lock314 (windows)
        if: matrix.python_version == '3.14' && matrix.os == 'windows-latest'
        shell: powershell
        run: |
          if (Test-Path pdm.lock314) {
            Write-Host "Using pdm.lock314 for python 3.14"
            Copy-Item pdm.lock314 -Destination pdm.lock -Force
          } else {
            Write-Host "pdm.lock314 not found; falling back to pdm.lock"
          }

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python_version }}

      # Caching step for speed (runs after potential copy so cache key includes chosen pdm.lock)
      - name: Set up PDM cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pdm
            .venv
          key: ${{ runner.os }}-pdm-${{ matrix.python_version }}-${{ hashFiles('pyproject.toml', 'pdm.lock') }}
          restore-keys: |
            ${{ runner.os }}-pdm-${{ matrix.python_version }}-

      - name: Install dependencies
        run: pdm install -dG test -dG sphinx

      - name: Run tests
        run: pdm all-tests

      - name: Coverage
        if: matrix.python_version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          pdm run pytest \
          --cov=numdifftools \
          --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python_version == '3.13' && matrix.os == 'ubuntu-latest'
        # See: https://martinheinz.dev/blog/69 "Ultimate CI Pipeline for All of Your Python Projects"
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pbrod/numdifftools
