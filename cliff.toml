# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = ""


body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [unreleased]
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}

{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

postprocessors = []

[git]

conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = []

commit_parsers = [

  # Features
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },

  # Bug fixes
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },

  # Security
  { body = "(?i).*security.*", group = "<!-- 2 -->🛡️ Security" },

  # Refactoring and typing improvements
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^chore\\(mypy\\)", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^fix\\(mypy\\)", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^refactor\\((typing|types|typehints)\\)", group = "<!-- 3 -->♻️ Refactoring" },

  # Documentation
  { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },

  # Performance
  { message = "^perf", group = "<!-- 5 -->⚡ Performance" },

  # Formatting and style
  { message = "^style", group = "<!-- 6 -->🎨 Styling" },

  # Testing
  { message = "^test", group = "<!-- 7 -->🧪 Testing" },

  # Build system
  { message = "^build", group = "<!-- 8 -->📦 Build System" },

  # Ignore release commits
  { message = "^chore\\(release\\)", skip = true },
  { message = "^docs\\(release\\)", skip = true },

  # CI/CD
  { message = "^ci", group = "<!-- 9 -->🏗️ CI/CD" },
  { message = "^chore\\(ci\\)", group = "<!-- 9 -->🏗️ CI/CD" },

  # Dependencies
  { message = "^chore\\(deps", group = "<!-- 10 -->📦 Dependencies" },
  { message = "^build\\(deps\\)", group = "<!-- 10 -->📦 Dependencies" },

  # Maintenance
  { message = "^chore", group = "<!-- 11 -->⚙️ Maintenance" },

  # Reverts
  { message = "^revert", group = "<!-- 12 -->◀️ Revert" },

  # Ignore changelog maintenance
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^chore\\(cliff\\)", skip = true },

  # Ignore lockfile-only commits
  { message = "^chore.*lock", skip = true },

  # Ignore automated PR maintenance
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
]

filter_commits = false

topo_order = false

sort_commits = "oldest"